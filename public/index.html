<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>发言席位</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- ================= 首页：创建 / 加入 ================= -->
  <section id="view-home" class="view">
    <div class="home-card">
      <h1 class="logo">🎙️ 发言席位</h1>
      <p class="subtitle">线下讨论 · 排队发言 · 投屏展示</p>

      <div class="home-block">
        <h2>创建房间（主持人）</h2>
        <form id="form-create" class="home-form">
          <input type="text" id="create-nick" maxlength="20" placeholder="主持人昵称（可选，默认「主持人」）" />
          <button type="submit" class="btn btn-primary btn-lg">创建房间</button>
        </form>
      </div>

      <div class="home-divider"><span>或</span></div>

      <div class="home-block">
        <h2>加入房间（参与者）</h2>
        <form id="form-join" class="home-form">
          <input type="text" id="join-room" maxlength="6" inputmode="numeric"
                 placeholder="6 位房间码" autocomplete="off" required />
          <input type="text" id="join-nick" maxlength="20" placeholder="你的昵称" autocomplete="off" required />
          <button type="submit" class="btn btn-secondary btn-lg">加入房间</button>
        </form>
      </div>
    </div>
  </section>

  <!-- ================= 房间 ================= -->
  <section id="view-room" class="view hidden">
    <header class="topbar">
      <div class="topbar-left">
        <span class="brand">🎙️ 发言席位</span>
        <span class="room-code" title="点击复制房间码" id="room-code">------</span>
        <span class="host-badge" id="host-badge">主持人</span>
        <button class="btn btn-mini" id="btn-copy-link" type="button">复制邀请链接</button>
      </div>
      <div class="topbar-right">
        <span class="version-badge" id="version-badge">v0</span>
        <span class="conn-dot" id="conn-dot" title="连接状态"></span>
        <span class="conn-text" id="conn-text">连接中…</span>
        <button class="btn btn-mini btn-ghost" id="btn-exit" type="button">退出房间</button>
      </div>
    </header>

    <main class="room-grid">
      <!-- 当前发言 -->
      <div class="panel panel-stage">
        <div class="panel-title">当前发言</div>
        <div class="stage" id="stage">
          <div class="stage-idle" id="stage-idle">
            <span class="stage-idle-emoji">🕊️</span>
            <span>暂无发言人</span>
          </div>
          <div class="stage-active hidden" id="stage-active">
            <div class="stage-nick" id="stage-nick"></div>
            <div class="stage-timer" id="stage-timer">00:00</div>
            <div class="stage-actions" id="stage-actions-host">
              <button class="btn btn-danger btn-lg" id="btn-end" type="button">结束发言</button>
            </div>
          </div>
        </div>
      </div>

      <!-- 发言队列 -->
      <div class="panel panel-queue">
        <div class="panel-title">
          发言队列 <span class="count" id="queue-count">0</span>
          <span class="hint host-only" id="reorder-hint">（拖动调整顺序）</span>
        </div>
        <ul class="queue-list" id="queue-list"></ul>
        <div class="queue-empty" id="queue-empty">队列为空，等待申请发言</div>

        <!-- 安全撤销：主持人最近一次可撤销操作的摘要 / 失效原因 -->
        <div class="undo-bar host-only" id="undo-bar" hidden></div>

        <!-- 协商换位：我发起 / 我收到的待处理邀请 -->
        <div class="swap-bar participant-only" id="swap-bar"></div>

        <div class="queue-actions participant-only">
          <button class="btn btn-primary btn-lg" id="btn-request" type="button">🙋 申请发言</button>
          <button class="btn btn-secondary btn-lg hidden" id="btn-cancel" type="button">取消申请</button>
        </div>
      </div>

      <!-- 右侧：记录 + 成员 -->
      <div class="panel panel-side panel-logs">
        <div class="panel-title">
          操作记录
          <button class="btn btn-mini btn-ghost host-only" id="btn-clear-logs" type="button">清空记录</button>
        </div>
        <ul class="log-list" id="log-list"></ul>
      </div>

      <div class="panel panel-side panel-people">
        <div class="panel-title">
          在场成员 <span class="count" id="people-count">0</span>
          <button class="btn btn-mini btn-danger host-only" id="btn-clear-all" type="button">一键清空</button>
        </div>
        <ul class="people-list" id="people-list"></ul>
      </div>
    </main>
  </section>

  <div class="toast-container" id="toast-container"></div>

  <script src="app.js"></script>
</body>
</html>
